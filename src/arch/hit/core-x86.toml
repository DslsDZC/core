# === core-x86.toml ===
# 硬件接口表（HIT）：x86-64 平台投影表——最小核（M1）第一份表。
# 格式定稿：docs/superpowers/plans/2026-09-05-hit-minimal-core-m1.md「表文件格式」节。
# 设计依据：docs/superpowers/specs/2026-09-05-hardware-interface-table.md。
# 契约：表 = corearch 运行的唯一平台依赖（M1：实现事件 1-4 即可运行）。
#
# 事件记录字段（每事件 32B，见 hit.cr 加载器）：
#   id          最小核事件号（sub=1 nand=2 load=3 store=4）
#   name        事件名（语义锚，供诊断/调试）
#   arith       语义锚：规约层引用（M1 不消费）
#   inputs/outputs      事件签名（无宽度/寄存器/寻址——最小核抽象）
#   side_effect "pure"/"effect"——内存效应标记
# [[event.proj]] 投影条目（每事件一个或多个；M1 每事件恰一个单步投影）：
#   opcode            指令字节序列（M1 ≤2 字节 = 前缀+opcode；[0x48,0x29] = REX.W + 29 /r）
#   modrm_reg_role    modrm.reg 字段操作数角色（dst/src1/src2/addr/val）
#   modrm_rm_role     modrm.rm  字段操作数角色
#   rm_mode           0 = rm 为寄存器（地址先加载进寄存器）；1 = rm 为 rbp+disp32（槽/常量池寻址）
# 解析规则见 hit.cr；模板解释/发射见计划 Task 2。

[table]
name = "core-x86-min"
events = 4            # 最小核契约：实现 1-4 即可运行

[[event]]
id = 1                # sub
name = "sub"
arith = "sub"         # 语义锚：规约层引用（M1 不消费）
inputs = 2
outputs = 1
side_effect = "pure"

[[event.proj]]        # x86 投影：sub r/m64, r64（REX.W + 29 /r）
isa = "x86-64"
opcode = [0x48, 0x29]        # REX.W + sub r/m64,r64
modrm_reg_role = "src1"      # reg 字段 = 源 1（寄存器）
modrm_rm_role = "dst"        # rm 字段 = 目标
rm_mode = 0                  # 0 = rm 为寄存器（加载到 r10）；1 = rm 为 rbp+disp32（槽/常量池寻址）

[[event]]
id = 2
name = "nand"
inputs = 2
outputs = 1
side_effect = "pure"

[[event.proj]]
isa = "x86-64"
# M1 占位：x86 无 nand 指令——单步 and（opcode 48 21 /r: and r/m64,r64）
# 投影到语义 nand 的完整序列（and+not 两步）+ 事件流语义闭合 = M2
opcode = [0x48, 0x21]
modrm_reg_role = "src1"
modrm_rm_role = "dst"
rm_mode = 0

[[event]]
id = 3
name = "load"
inputs = 1            # 地址
outputs = 1
side_effect = "effect"

[[event.proj]]
isa = "x86-64"
opcode = [0x48, 0x8B]        # mov r64, r/m64（读）
modrm_reg_role = "dst"
modrm_rm_role = "addr"

[[event]]
id = 4
name = "store"
inputs = 2            # 地址, 值
outputs = 0
side_effect = "effect"

[[event.proj]]
isa = "x86-64"
opcode = [0x48, 0x89]        # mov r/m64, r64（写）
modrm_reg_role = "val"
modrm_rm_role = "addr"
