name: CI
on:
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
# (ascii-only test)
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

jobs:
  job:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
# (ascii-only test)
# (ascii-only test)
    if: ${{ matrix.run_type == 'pr' || github.event_name == 'merge_group' }}
    env:
      CI_JOB_NAME: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: check
            run_type: pr
          - name: bootstrap-tests
            run_type: pr
          - name: selfhost-tests
            run_type: pr
          - name: suite
            run_type: full
          - name: full-bootstrap
            run_type: full
# (ascii-only test)
# (ascii-only test)
# (ascii-only test)
    steps:
      - name: checkout the source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: add extra environment variables
        run: src/ci/scripts/setup-environment.sh

      - name: run the build
        run: src/ci/scripts/run-build-from-ci.sh
